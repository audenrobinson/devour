<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Trinicle Marketing">
  <title>Trinicle Marketing</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div class="ink-field" aria-hidden="true">
      <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
    </div>
    <section class="specialty-map" aria-labelledby="specialty-title">
      <h2 id="specialty-title">Three ways to grow your business.</h2>
      <div class="triangle-map">
        <span class="dot-link link-left" aria-hidden="true"></span>
        <span class="dot-link link-right" aria-hidden="true"></span>
        <span class="dot-link link-base" aria-hidden="true"></span>

        <article class="ink-circle circle-top">
          <svg viewBox="0 0 220 220" aria-hidden="true"><circle cx="110" cy="110" r="102"></circle></svg>
          <h3>AI SEO</h3>
        </article>
        <article class="ink-circle circle-left">
          <svg viewBox="0 0 220 220" aria-hidden="true"><circle cx="110" cy="110" r="102"></circle></svg>
          <h3>AI Advertising</h3>
        </article>
        <article class="ink-circle circle-right">
          <svg viewBox="0 0 220 220" aria-hidden="true"><circle cx="110" cy="110" r="102"></circle></svg>
          <h3>Digital Business<br>Systems</h3>
        </article>
      </div>
    </section>
    <h1 aria-label="Trinicle Marketing">
      <span class="full-title">Trinicle Marketing</span>
      <span class="compact-title" aria-hidden="true">[TM]</span>
    </h1>
  </main>
</body>
</html>
